<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Animation</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*,
*:before,
*:after {
  box-sizing: border-box;
}

body {
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background: #e8e8e8;
  height: 100vh;
  display: flex;
}

.block-wrap {
  width: 420px;
  height: 300px;
  background: #efefef;
  border-bottom: 2px solid #ccc;
  box-shadow:
      inset 0 1px 0 #fff,
      0 8px 8px -8px #ccc,
      0 12px 12px -8px #ddd;
  display: flex;
  position: relative;
  overflow: hidden;
  justify-content: center;
  border-radius: 20px;
  margin: auto;
  padding-top: 40px;
}
.block-wrap::before {
  content: "";
  position: absolute;
  top: 38px;
  left: 0;
  right: 0;
  height: 1px;
  background: rgba(0,0,0,0.15);
  z-index: 900;
}

.project-title {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-family: "Cinzel", serif;
  font-size: 20px;
  letter-spacing: 6px;
  color: rgba(0,0,0,0.55);
  text-transform: uppercase;
  pointer-events: none;
  z-index: 1000;
  background: #efefef;
  padding: 2px 12px;
  border-radius: 6px;
}

.block-col {
  display: flex;
  height: 100%;
  margin: 0 12px;
  width: 64px;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
}

.block {
  height: 64px;
  width: 100%;
  border-radius: 50%;
  margin: auto 0;
  position: relative;
  will-change: transform;
  transition: transform 0.185s cubic-bezier(0.4,0,0,1);
}

.block.block--active {
  border-radius: 20px;
}

.block:not(.block--active) {
  cursor: pointer;
}

.block:not(.block--active):hover {
  transform: translateY(-12px);
}

.block:not(.block--active):active {
  transform: scale(0.9) translateY(-12px);
}

.block--active {
  position: absolute;
  left: 0;
  z-index: 1;
  height: 100%;
  width: 100%;
  border-radius: 20px;
}

.block-content {
  display: none;
  padding: 24px;
}

.block--active .block-content {
  display: block;
}

.block-content__header {
  background: rgba(0,0,0,0.1);
  padding: 24px;
  margin: -24px -24px 24px;
}

.block-content__header__text {
  margin: 0;
  opacity: 0;
  font-size: 2em;
  animation: content-in .225s forwards;
  animation-delay: .15s;
}

.block-content__body {
  opacity: 0;
  font-size: 18px;
  line-height: 1.333;
  animation: content-in .245s forwards;
  animation-delay: .1s;
  margin: 0 0 20px;
}

.block-content__button {
  font-weight: bold;
  background: rgba(255,255,255,.25);
  display: inline-block;
  padding: 16px;
  border-radius: 4px;
  color: rgba(255,255,255,.85);
  animation: button-in .245s forwards;
  animation-delay: .2s;
  opacity: 0;
  cursor: pointer;
}

/* Animations */
@keyframes content-in {
  0% { opacity: 0; transform: translateY(128px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes button-in {
  0% { opacity: 0; transform: translateY(64px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* Colors */
.r {
  background: #f44336;
  color: #222;
}

.b {
  background: #1e88e5;
  color: #fff;
}

.y {
  background: #fdd835;
  color: #333;
}

.o {
  background: #ff6f00;
  color: #222;
}

.o .block-content__header {
  background: #ff6f00;
}

.r .block-content__header { background: #f44336; }
.b .block-content__header { background: #1e88e5; }
.y .block-content__header { background: #fdd835; }

</style>
</head>

<body>

<div class="block-wrap">

  <div class="project-title">Project</div>

  <div class="block-col">
    <div class="block r">
      <div class="block-content">
        <div class="block-content__header">
          <h2 class="block-content__header__text">Red</h2>
        </div>
        <p class="block-content__body">
          Red is the color at the end of the visible spectrum.
        </p>
        <div class="block-content__button">Neato</div>
      </div>
    </div>
  </div>

  <div class="block-col">
    <div class="block b">
      <div class="block-content">
        <div class="block-content__header">
          <h2 class="block-content__header__text">Blue</h2>
        </div>
        <p class="block-content__body">
          Blue lies between violet and green.
        </p>
        <div class="block-content__button">Very Cool</div>
      </div>
    </div>
  </div>

  <div class="block-col">
    <div class="block y">
      <div class="block-content">
        <div class="block-content__header">
          <h2 class="block-content__header__text">Yellow</h2>
        </div>
        <p class="block-content__body">
          Yellow sits between orange and green.
        </p>
        <div class="block-content__button">Nice</div>
      </div>
    </div>
  </div>

  <div class="block-col">
    <div class="block o">
      <div class="block-content">
        <div class="block-content__header">
          <h2 class="block-content__header__text">Orange</h2>
        </div>
        <p class="block-content__body">
          Orange is a bright, energetic color between red and yellow.
        </p>
        <div class="block-content__button">Awesome</div>
      </div>
    </div>
  </div>

</div>

<script>
const ACTIVE_CLASS = "block--active";
const TRANSITION_CLASS = "block--transition";

const getTransforms = (a, b) => {
  const scaleY = a.height / b.height;
  const scaleX = a.width / b.width;

  const translateX = a.left + a.width / 2 - (b.left + b.width / 2);
  const translateY = a.top + a.height / 2 - (b.top + b.height / 2);

  const rotate = translateX;

  return `
    translateX(${translateX}px)
    translateY(${translateY}px)
    rotate(${rotate}deg)
    scaleY(${scaleY})
    scaleX(${scaleX})
  `;
};

const animate = (block, transforms, oldTransforms) => {
  block.style.transform = transforms;
  block.getBoundingClientRect();
  block.classList.add(TRANSITION_CLASS);
  block.style.transform = oldTransforms;

  block.addEventListener("transitionend", () => {
    block.removeAttribute("style");
  }, { once: true });
};

document.querySelectorAll(".block").forEach(block => {
  const button = block.querySelector(".block-content__button");

  block.addEventListener("click", e => {

    if (
      block.classList.contains(ACTIVE_CLASS) &&
      e.target !== button
    ) return;

    block.classList.remove(TRANSITION_CLASS);

    const inactive = block.getBoundingClientRect();
    const old = block.style.transform;

    block.classList.toggle(ACTIVE_CLASS);

    const active = block.getBoundingClientRect();
    const transforms = getTransforms(inactive, active);

    animate(block, transforms, old);
  });
});
</script>

</body>
</html>
